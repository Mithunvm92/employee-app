version: "3.8"

services:
  db:
    build: ./database
    container_name: employee-db
    environment:
      POSTGRES_DB: employees
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: employee-backend
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: employees
      DB_USER: postgres
      DB_PASSWORD: password
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    container_name: employee-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
